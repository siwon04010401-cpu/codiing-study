<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파이썬 학습 노트</title>
<style>
/* 파이썬 실습실 – 스타일
   레이아웃: 상단 바 + 좌측 단원 목록 + 중앙 학습 영역 (좁은 화면에서는 목록이 서랍으로 전환)
   모든 색은 토큰으로 정의하고 라이트/다크를 같은 구조로 둔다. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --surface2: #EAEEF5; --line: #D5DCE7; --line2: #E4E9F1;
  --fg: #16202F; --muted: #586479;
  --accent: #245BB5; --accent-fg: #FFFFFF; --accent-soft: #E2ECFB; --accent-line: #B7CDF0;
  --book: #0F6E63; --book-soft: #DDF1EE;
  --ai: #8F5600; --ai-soft: #FFEFD0;
  --ok: #1B7A4B; --ok-soft: #DDF3E7; --err: #B3261E; --err-soft: #FCE4E1; --warn: #8A6100;
  --code-bg: #F6F8FC; --out-bg: #0E1622; --out-fg: #E3EAF4; --out-err: #FF9C8F; --out-echo: #8FD6A8; --out-dim: #7D8CA3;
  --syn-kw: #A53F8C; --syn-str: #1C7C4D; --syn-num: #B45309; --syn-com: #7A8699; --syn-def: #245BB5; --syn-builtin: #0E7490; --syn-op: #586479;
  --diff-del: #FDE4E1; --diff-add: #DDF3E7; --diff-chg: #FFF1CF;
  --shadow: 0 1px 2px rgba(20,32,50,.06), 0 4px 14px rgba(20,32,50,.05);
  --topbar-h: 56px; --side-w: 304px; --radius: 10px;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "D2Coding", monospace;
  --code-size: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131C; --surface: #141C28; --surface2: #1B2433; --line: #2A3547; --line2: #212B3B;
    --fg: #E5EBF4; --muted: #9AA6BA;
    --accent: #7EA6EE; --accent-fg: #0D131C; --accent-soft: #1B2A45; --accent-line: #33507F;
    --book: #5CC4B5; --book-soft: #12302D; --ai: #F0B45A; --ai-soft: #3A2B10;
    --ok: #58C98D; --ok-soft: #12301F; --err: #FF8E82; --err-soft: #3A1713; --warn: #E3B341;
    --code-bg: #101824; --out-bg: #080D14; --out-fg: #DCE5F2; --out-err: #FF9C8F; --out-echo: #7FD4A0; --out-dim: #7B8AA1;
    --syn-kw: #D98BC5; --syn-str: #7FD4A0; --syn-num: #F0B57A; --syn-com: #7F8DA3; --syn-def: #8DB4F5; --syn-builtin: #6CCBE0; --syn-op: #9AA6BA;
    --diff-del: #3A1D1B; --diff-add: #14301F; --diff-chg: #3A3016;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131C; --surface: #141C28; --surface2: #1B2433; --line: #2A3547; --line2: #212B3B;
  --fg: #E5EBF4; --muted: #9AA6BA;
  --accent: #7EA6EE; --accent-fg: #0D131C; --accent-soft: #1B2A45; --accent-line: #33507F;
  --book: #5CC4B5; --book-soft: #12302D; --ai: #F0B45A; --ai-soft: #3A2B10;
  --ok: #58C98D; --ok-soft: #12301F; --err: #FF8E82; --err-soft: #3A1713; --warn: #E3B341;
  --code-bg: #101824; --out-bg: #080D14; --out-fg: #DCE5F2; --out-err: #FF9C8F; --out-echo: #7FD4A0; --out-dim: #7B8AA1;
  --syn-kw: #D98BC5; --syn-str: #7FD4A0; --syn-num: #F0B57A; --syn-com: #7F8DA3; --syn-def: #8DB4F5; --syn-builtin: #6CCBE0; --syn-op: #9AA6BA;
  --diff-del: #3A1D1B; --diff-add: #14301F; --diff-chg: #3A3016;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + 14px); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
  font: 400 15px/1.65 var(--font); letter-spacing: -0.005em; word-break: keep-all; overflow-wrap: anywhere;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: .92em; background: var(--surface2); padding: .08em .38em; border-radius: 5px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ── 상단 바 ─────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
  display: flex; align-items: center; gap: 14px;
  padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.iconbtn {
  width: 38px; height: 38px; display: inline-grid; place-items: center; flex: none;
  border: 1px solid var(--line); background: var(--surface); border-radius: 9px;
}
.iconbtn:hover { background: var(--surface2); }
.iconbtn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.menu-btn { display: none; }
.brand { font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; display: flex; align-items: baseline; gap: 8px; }
.brand .mark { font-family: var(--mono); color: var(--accent); font-weight: 700; }
.crumb { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb b { color: var(--fg); font-weight: 600; }
.top-spacer { flex: 1; }
.progress-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.progress-label { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.progress-label b { color: var(--fg); }
.bar { width: 150px; height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line2); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.runner-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.runner-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.runner-dot[data-state="ready"]::before { background: var(--ok); }
.runner-dot[data-state="loading"]::before { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
.runner-dot[data-state="error"]::before { background: var(--err); }
@keyframes pulse { 50% { opacity: .35; } }
.save-ind { font-size: 12.5px; color: var(--muted); white-space: nowrap; min-width: 4.2em; text-align: right; }

/* ── 전체 레이아웃 ─────────────────────── */
.layout { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); align-items: start; }
.side {
  position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); height: calc(100dvh - var(--topbar-h));
  overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line);
  padding: 14px 10px max(16px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 6px;
}
.side-title { font-size: 12px; letter-spacing: .08em; color: var(--muted); padding: 4px 10px 6px; text-transform: uppercase; }
.chitem {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "no tt cnt" "no bar bar";
  column-gap: 8px; row-gap: 5px; align-items: center; padding: 9px 10px; border-radius: 9px;
  color: var(--fg); text-decoration: none; border: 1px solid transparent;
}
.chitem:hover { background: var(--surface2); }
.chitem[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent-line); }
.chitem .no { grid-area: no; font-family: var(--mono); font-weight: 700; font-size: 17px; color: var(--accent); text-align: center; }
.chitem .tt { grid-area: tt; font-size: 14px; font-weight: 500; line-height: 1.3; min-width: 0; }
.chitem .cnt { grid-area: cnt; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chitem .mini { grid-area: bar; height: 4px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.chitem .mini > i { display: block; height: 100%; background: var(--ok); }
.chitem.complete .no { color: var(--ok); }
.side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line2); display: grid; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--surface2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.danger { color: var(--err); border-color: var(--err); }
.btn.sm { min-height: 30px; padding: 3px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface2); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.scrim { display: none; }

.main { min-width: 0; padding: 26px max(20px, env(safe-area-inset-right, 0px)) max(60px, env(safe-area-inset-bottom, 0px)) 28px; }
.main-inner { max-width: 920px; margin: 0 auto; }

/* ── 단원 머리말 · 탭 ──────────────────── */
.chhead { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 18px; align-items: end; margin-bottom: 18px; }
.chhead .big { font-family: var(--mono); font-weight: 700; font-size: 64px; line-height: .9; color: var(--accent); letter-spacing: -.04em; }
.chhead h1 { margin: 0; font-size: 28px; line-height: 1.25; letter-spacing: -.02em; text-wrap: balance; }
.chhead .meta { margin-top: 6px; color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: var(--surface2); padding: 5px; border-radius: 12px; margin-bottom: 20px; position: sticky; top: calc(var(--topbar-h) + 8px); z-index: 10; border: 1px solid var(--line2); }
.tab {
  border: 0; background: transparent; padding: 8px 6px; border-radius: 8px; display: grid; gap: 1px; justify-items: center; line-height: 1.25;
}
.tab .t1 { font-weight: 600; font-size: 14.5px; }
.tab .t2 { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--surface); box-shadow: var(--shadow); color: var(--accent); }
.tab[aria-selected="true"] .t2 { color: var(--accent); }
.tab:hover:not([aria-selected="true"]) { background: color-mix(in srgb, var(--surface) 55%, transparent); }

/* ── 설명 ─────────────────────────────── */
.secnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 3px 10px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; line-height: 1.5;
}
a.chip:hover, button.chip:hover { background: var(--accent-soft); border-color: var(--accent-line); }
.concept-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px 16px; margin-bottom: 14px; }
.concept-sec > h2 { margin: 0 0 10px; font-size: 19px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.concept-sec > h2::before { content: ""; width: 4px; height: 1em; background: var(--accent); border-radius: 3px; }
.md p { margin: .45em 0; }
.md ul, .md ol { margin: .4em 0; padding-left: 1.4em; }
.md li { margin: .15em 0; }
.md li > ul, .md li > ol { margin: .1em 0; }
.md blockquote { margin: .6em 0; padding: .3em 1em; border-left: 3px solid var(--accent-line); color: var(--muted); }
.codeblock { position: relative; margin: 10px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); }
.codeblock pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 400 var(--code-size)/1.6 var(--mono); tab-size: 4; }
.codeblock .cb-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 8px; border-bottom: 1px solid var(--line2); font-size: 12.5px; color: var(--muted); }
.codeblock .cb-bar .sp { flex: 1; }
.codeblock .tag-tmpl { color: var(--warn); font-weight: 500; }
.cm-keyword, .tok-kw { color: var(--syn-kw); font-weight: 500; }
.cm-string, .cm-string-2 { color: var(--syn-str); }
.cm-number { color: var(--syn-num); }
.cm-comment { color: var(--syn-com); font-style: italic; }
.cm-def { color: var(--syn-def); }
.cm-builtin { color: var(--syn-builtin); }
.cm-operator { color: var(--syn-op); }
.cm-variable-2 { color: var(--fg); }
.cm-meta { color: var(--syn-builtin); }

/* ── 문제 카드 ────────────────────────── */
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 18px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: calc(var(--topbar-h) + 80px); }
.pcard.is-done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.pc-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px 6px; flex-wrap: wrap; }
.done-btn {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; padding: 0;
}
.done-btn svg { width: 15px; height: 15px; stroke: var(--accent-fg); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.done-btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); }
.done-btn[aria-pressed="true"] svg { opacity: 1; }
.done-btn:hover { border-color: var(--ok); }
.pc-head h3 { margin: 0; font-size: 17px; letter-spacing: -.01em; flex: 1 1 auto; min-width: 8em; }
.pc-head h3 .idx { font-family: var(--mono); color: var(--muted); font-weight: 500; margin-right: 6px; font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 1px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); background: var(--surface2); line-height: 1.6; white-space: nowrap; }
.tag.book { color: var(--book); background: var(--book-soft); border-color: transparent; font-weight: 600; }
.tag.ai { color: var(--ai); background: var(--ai-soft); border-color: transparent; font-weight: 600; }
.tag.none { color: var(--err); background: var(--err-soft); border-color: transparent; font-weight: 600; }
.tag.extra { color: var(--ai); background: var(--ai-soft); border-color: transparent; }
.pc-body { padding: 4px 16px 14px; }
.prompt { margin: 2px 0 8px; }
.notebox { margin: 8px 0; padding: 8px 12px; border-radius: 8px; background: var(--ai-soft); color: var(--fg); font-size: 13.5px; border-left: 3px solid var(--ai); }
.notebox b { color: var(--ai); }
.notebox.err { background: var(--err-soft); border-left-color: var(--err); }
.lesson { margin: 8px 0; }
.lesson > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--book); padding: 4px 0; }
.edwrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); margin-top: 8px; }
.edwrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.edlabel { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 4px 10px; border-bottom: 1px solid var(--line2); background: var(--surface2); }
.CodeMirror { height: auto; min-height: 132px; font: 400 var(--code-size)/1.6 var(--mono); background: var(--code-bg); color: var(--fg); }
.CodeMirror-gutters { background: var(--surface2); border-right: 1px solid var(--line2); }
.CodeMirror-linenumber { color: var(--muted); }
.CodeMirror-cursor { border-left: 2px solid var(--fg); }
.CodeMirror-selected { background: var(--accent-soft) !important; }
.CodeMirror-focused .CodeMirror-selected { background: var(--accent-line) !important; }
.CodeMirror-matchingbracket { color: var(--ok) !important; background: var(--ok-soft); }
.CodeMirror-nonmatchingbracket { color: var(--err) !important; }
.CodeMirror-lines { padding: 8px 0; }
.plain-ed { display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--code-bg); }
.plain-ed .gut { margin: 0; padding: 12px 8px 12px 10px; text-align: right; color: var(--muted); background: var(--surface2); border-right: 1px solid var(--line2); font: 400 var(--code-size)/1.6 var(--mono); user-select: none; }
.plain-ed textarea { border: 0; outline: 0; resize: none; background: transparent; padding: 12px 12px; font: 400 var(--code-size)/1.6 var(--mono); white-space: pre; overflow-x: auto; overflow-y: hidden; min-height: 132px; width: 100%; tab-size: 4; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.toolbar .sp { flex: 1; }
.stdin-box { margin-top: 8px; }
.stdin-box label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }
.stdin-box textarea { width: 100%; min-height: 72px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--code-bg); font: 400 var(--code-size)/1.5 var(--mono); resize: vertical; }

.out { margin-top: 12px; border-radius: 8px; overflow: hidden; background: var(--out-bg); color: var(--out-fg); border: 1px solid color-mix(in srgb, var(--out-bg) 70%, var(--line)); }
.out-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 12.5px; background: color-mix(in srgb, var(--out-bg) 80%, #fff 6%); color: var(--out-dim); }
.out-head .out-status { flex: 1; min-width: 0; color: var(--out-fg); }
.out-head .out-status[data-k="ok"] { color: var(--out-echo); }
.out-head .out-status[data-k="error"], .out-head .out-status[data-k="timeout"], .out-head .out-status[data-k="fatal"] { color: var(--out-err); }
.out-head button { background: transparent; border: 0; color: var(--out-dim); font-size: 12.5px; padding: 2px 6px; border-radius: 5px; }
.out-head button:hover { color: var(--out-fg); background: rgba(255,255,255,.08); }
.out-body { margin: 0; padding: 10px 14px; font: 400 var(--code-size)/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; min-height: 2.6em; max-height: 420px; overflow: auto; }
.out-body .ph { color: var(--out-dim); font-style: italic; font-family: var(--font); }
.out-body .err { color: var(--out-err); }
.out-body .echo { color: var(--out-echo); }
.out-figs { display: grid; gap: 10px; padding: 0 14px 12px; }
.out-figs img { max-width: 100%; height: auto; background: #fff; border-radius: 6px; justify-self: start; }
.out-files { border-top: 1px solid rgba(255,255,255,.1); padding: 8px 14px 10px; font-size: 13px; }
.out-files summary { cursor: pointer; color: var(--out-dim); }
.out-files pre { margin: 6px 0 2px; padding: 8px 10px; background: rgba(255,255,255,.06); border-radius: 6px; font: 400 13px/1.5 var(--mono); white-space: pre-wrap; }
.out-input { display: flex; gap: 8px; align-items: center; padding: 8px 14px 12px; border-top: 1px dashed rgba(255,255,255,.18); }
.out-input .pt { font: 400 var(--code-size)/1.5 var(--mono); color: var(--out-echo); white-space: pre-wrap; max-width: 48%; }
.out-input input { flex: 1; min-width: 0; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07); color: var(--out-fg); font: 400 var(--code-size)/1.5 var(--mono); }
.out-input button { padding: 6px 12px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 600; }

.hints { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.hints li { padding: 8px 12px; border-radius: 8px; background: var(--ai-soft); border-left: 3px solid var(--ai); font-size: 14px; }
.hints li b { color: var(--ai); margin-right: 6px; font-size: 12.5px; letter-spacing: .02em; }
.tests { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 13.5px; }
.tests .trow { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; padding: 8px 12px; border-top: 1px solid var(--line2); }
.tests .trow:first-child { border-top: 0; }
.tests .trow.ok { background: var(--ok-soft); }

.diff .add .dc:last-child .dt, .diff .add .dc:last-child .dn { background: var(--diff-add); }

.diffsum { padding: 7px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line2); }

.empty { text-align: center; padding: 40px 20px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); background: var(--surface); }

.chnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; flex-wrap: wrap; }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 0; width: min(520px, calc(100vw - 28px)); box-shadow: 0 20px 60px rgba(0,0,0,.35); }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 반응형 ───────────────────────────── */

}

<script>
/* 가벼운 마크다운 변환 + 파이썬 정적 하이라이트 (외부 라이브러리 없음) */
(function () {
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var KW = 'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' ');
  var BUILTIN = 'print input int float str bool list tuple dict set len range type open sum min max abs round sorted reversed enumerate zip map filter isinstance super object self format append insert remove pop index count extend keys values items get'.split(' ');
  var KWS = {}, BIS = {};
  KW.forEach(function (k) { KWS[k] = 1; }); BUILTIN.forEach(function (k) { BIS[k] = 1; });

  function highlight(code) {
    var out = '', i = 0, n = code.length, prevWord = '';
    while (i < n) {
      var c = code[i], m;
      if (c === '#') { m = /^#[^\n]*/.exec(code.slice(i)); out += '<span class="cm-comment">' + esc(m[0]) + '</span>'; i += m[0].length; continue; }
      if (c === '"' || c === "'") {
        var q = c, tri = code.substr(i, 3) === q + q + q, j = i + (tri ? 3 : 1);
        while (j < n) {
          if (code[j] === '\\') { j += 2; continue; }
          if (tri ? code.substr(j, 3) === q + q + q : code[j] === q || code[j] === '\n') { j += tri ? 3 : (code[j] === q ? 1 : 0); break; }
          j++;
        }
        out += '<span class="cm-string">' + esc(code.slice(i, j)) + '</span>'; i = j; continue;
      }
      m = /^\d+(\.\d+)?([eE][+-]?\d+)?/.exec(code.slice(i));
      if (m && !/[\w]/.test(code[i - 1] || '')) { out += '<span class="cm-number">' + m[0] + '</span>'; i += m[0].length; continue; }
      m = /^[A-Za-z_À-￿][\wÀ-￿]*/.exec(code.slice(i));
      if (m) {
        var w = m[0], cls = '';
        if (KWS[w]) cls = 'cm-keyword'; else if (prevWord === 'def' || prevWord === 'class') cls = 'cm-def'; else if (BIS[w] && code[i + w.length] === '(') cls = 'cm-builtin';
        out += cls ? '<span class="' + cls + '">' + esc(w) + '</span>' : esc(w);
        prevWord = w; i += w.length; continue;
      }
      if (!/\s/.test(c)) prevWord = '';
      out += esc(c); i++;
    }
    return out;
  }

  function inline(s) {
    s = esc(s);
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + codes[+i] + '</code>'; });
  }

  function codeBlockHtml(code, label) {
    return '<div class="codeblock">' + (label ? '<div class="cb-bar">' + label + '</div>' : '') +
      '<pre><code>' + highlight(code) + '</code></pre></div>';
  }

  // 목록(들여쓰기 중첩 포함), 코드펜스, 인용, 문단
  function render(text) {
    var lines = String(text || '').replace(/\r/g, '').split('\n'), i = 0, html = '';
    function indentOf(l) { return /^ */.exec(l)[0].length; }
    function listAt(indent) {
      var m0 = /^\s*(?:([-*])|(\d+)\.)\s+/.exec(lines[i]);
      var ordered = !!m0[2], out = ordered ? '<ol>' : '<ul>';
      while (i < lines.length) {
        var l = lines[i], m = /^(\s*)(?:([-*])|(\d+)\.)\s+(.*)$/.exec(l);
        if (!m || m[1].length < indent) break;
        if (m[1].length > indent) break;
        var item = inline(m[4]); i++;
        var extra = '';
        while (i < lines.length) {
          var n = lines[i];
          if (/^\s*$/.test(n)) break;
          var nm = /^(\s*)(?:[-*]|\d+\.)\s+/.exec(n);
          if (nm && nm[1].length > indent) { extra += listAt(nm[1].length); continue; }
          if (nm) break;
          if (indentOf(n) > indent) { item += ' ' + inline(n.trim()); i++; continue; }
          break;
        }
        out += '<li>' + item + extra + '</li>';
      }
      return out + (ordered ? '</ol>' : '</ul>');
    }
    while (i < lines.length) {
      var l = lines[i];
      if (/^\s*$/.test(l)) { i++; continue; }
      var fence = /^```(\w*)\s*$/.exec(l);
      if (fence) {
        var buf = []; i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++]);
        i++; html += codeBlockHtml(buf.join('\n')); continue;
      }
      var h = /^(#{1,4})\s+(.*)$/.exec(l);
      if (h) { var lv = Math.min(h[1].length + 2, 6); html += '<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'; i++; continue; }
      if (/^>\s?/.test(l)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ''));
        html += '<blockquote>' + render(q.join('\n')) + '</blockquote>'; continue;
      }
      if (/^\s*(?:[-*]|\d+\.)\s+/.test(l)) { html += listAt(indentOf(l)); continue; }
      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^```/.test(lines[i]) && !/^\s*(?:[-*]|\d+\.)\s+/.test(lines[i]) && !/^#{1,4}\s/.test(lines[i])) para.push(lines[i++]);
      html += '<p>' + inline(para.join(' ')) + '</p>';
    }
    return html;
  }

  var api = { render: render, highlight: highlight, esc: esc, codeBlock: codeBlockHtml };
  if (typeof window !== 'undefined') window.PLMd = api;
  if (typeof module !== 'undefined') module.exports = api;
})();

</script>
